version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: cipherx
      POSTGRES_PASSWORD: cipherx_password
      POSTGRES_DB: cipherx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cipherx"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 1. FastAPI Cybersecurity Core API
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: cipherx-backend
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://cipherx:cipherx_password@db:5432/cipherx
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=cipherx-prod-secret-change-in-env-2026
      - STORAGE_TYPE=local
      - AI_PROVIDER=deterministic_grounded
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3

  # 2. React SPA Frontend & Reverse Proxy
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: cipherx-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:80"]
      interval: 15s
      timeout: 3s
      retries: 3

  # 3. Asynchronous Worker
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: cipherx-worker
    restart: unless-stopped
    depends_on:
      - backend
      - redis
      - db

  # 4. Redis Cache & Messaging Broker
  redis:
    image: redis:7-alpine
    container_name: cipherx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # 5. MinIO S3 Object Storage
  minio:
    image: minio/minio:latest
    container_name: cipherx-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=cipherx_admin
      - MINIO_ROOT_PASSWORD=CipherXSecurePassword2026!
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
