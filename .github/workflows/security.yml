name: Cipher-X Security & Hardening Audit

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0' # Weekly scan

jobs:
  security-audit:
    name: Dependency Audit & Invariant Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pip-audit

      - name: Run Python Dependency Vulnerability Audit
        run: |
          pip-audit || true

      - name: Run Security Invariant Tests
        run: |
          python -m pytest backend/tests/test_golden_dataset.py -v
