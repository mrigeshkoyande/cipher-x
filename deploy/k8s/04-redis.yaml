apiVersion: v1
kind: Service
metadata:
  name: cipherx-redis
  namespace: cipher-x
  labels:
    app.kubernetes.io/name: cipher-x
    app.kubernetes.io/component: redis
spec:
  ports:
    - port: 6379
      name: redis
  selector:
    app.kubernetes.io/name: cipher-x
    app.kubernetes.io/component: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cipherx-redis
  namespace: cipher-x
  labels:
    app.kubernetes.io/name: cipher-x
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cipher-x
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cipher-x
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
